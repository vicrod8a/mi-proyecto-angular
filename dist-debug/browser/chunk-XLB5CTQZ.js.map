<p-toast></p-toast>

<div class="auth-container">
  <div class="auth-card">
    <div class="logo-section">
      <i class="pi pi-lock" style="font-size: 3rem; color: #6c757d;"></i>
      <h2>Bienvenido de Vuelta</h2>
      <p>Por favor inicia sesión en tu cuenta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Correo Electrónico</label>
        <span class="p-input-icon-left">
          <i class="pi pi-envelope"></i>
          <input
            type="email"
            id="email"
            placeholder="Ingresa tu correo"
            formControlName="email"
            class="w-full p-inputtext"
            [class.ng-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
        </span>
        <small class="p-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Correo electrónico válido requerido
        </small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <span class="p-input-icon-left">
          <i class="pi pi-lock"></i>
          <p-password
            id="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
            [feedback]="false"
            class="w-full"
            inputId="password"
            [class.ng-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          ></p-password>
        </span>
        <small class="p-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Contraseña requerida
        </small>
      </div>

      <div class="field-checkbox">
        <p-checkbox
          label="Recordarme"
          formControlName="rememberMe"
          inputId="remember"
        ></p-checkbox>
      </div>

      <p-button
        type="submit"
        label="Iniciar Sesión"
        [loading]="loading"
        [disabled]="loginForm.invalid"
        class="w-full login-btn"
        icon="pi pi-sign-in"
      ></p-button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes una cuenta?
        <a routerLink="/auth/register">
          <strong>Regístrate aquí</strong>
        </a>
      </p>
    </div>
  </div>
</div>
