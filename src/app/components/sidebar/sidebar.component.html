<div
  [ngClass]="{
    'w-64': sidebarVisible,
    'w-16': !sidebarVisible
  }"
  class="bg-gradient-to-b from-gray-800 to-gray-900 text-white flex flex-col transition-width duration-300 h-full overflow-hidden">
  <div class="flex items-center justify-between p-4">
    <h3 class="flex items-center gap-2 text-lg font-semibold">
      <i class="pi pi-bars"></i>
      <span *ngIf="sidebarVisible">Menú</span>
    </h3>
    <button
      (click)="toggleSidebar()"
      title="Toggle menu"
      class="p-2 rounded hover:bg-gray-700">
      <i [ngClass]="sidebarVisible ? 'pi pi-times' : 'pi pi-bars'"></i>
    </button>
  </div>

  <div class="flex-1 overflow-auto">
    <ul class="space-y-1">
      <li *ngFor="let item of menu">
        <a
          [routerLink]="item.link"
          routerLinkActive="bg-gray-700 text-white"
          class="flex items-center gap-2 p-2 text-gray-300 hover:bg-gray-700 hover:text-white rounded">
          <i [class]="item.icon"></i>
          <span *ngIf="sidebarVisible">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </div>
</div>
