<div class="p-6 bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-6 flex items-center justify-between">
      <div>
        <button (click)="goBack()" class="mb-4 px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
          ← Volver al Dashboard
        </button>
        <h2 class="text-2xl font-bold">Gestión del Grupo</h2>
        <p class="text-gray-600">Administra los usuarios y configuración del grupo</p>
      </div>
    </div>

    <!-- Group Settings -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h3 class="text-xl font-semibold mb-4">Configuración del Grupo</h3>

      <div *ngIf="!editMode" class="flex items-center justify-between">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nombre del Grupo</label>
          <p class="text-lg">{{ groupName }}</p>
        </div>
        <button (click)="toggleEditMode()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
          Editar
        </button>
      </div>

      <form *ngIf="editMode" [formGroup]="groupForm" (ngSubmit)="saveGroupSettings()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Nombre del Grupo</label>
          <input formControlName="name" class="w-full p-2 border rounded" placeholder="Nombre del grupo">
        </div>
        <div class="flex space-x-2">
          <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
            Guardar
          </button>
          <button type="button" (click)="toggleEditMode()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">
            Cancelar
          </button>
        </div>
      </form>
    </div>

    <!-- Add User -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h3 class="text-xl font-semibold mb-4">Añadir Usuario</h3>
      <form [formGroup]="addUserForm" (ngSubmit)="addUser()" class="flex space-x-2">
        <input formControlName="email" type="email" class="flex-1 p-2 border rounded" placeholder="Email del usuario">
        <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
          Añadir
        </button>
      </form>
    </div>

    <!-- Users List -->
    <div class="bg-white rounded-lg shadow p-6">
      <h3 class="text-xl font-semibold mb-4">Usuarios del Grupo</h3>

      <div class="space-y-3">
        <div *ngFor="let user of groupUsers" class="flex items-center justify-between p-4 border rounded">
          <div class="flex items-center space-x-4">
            <img src="https://via.placeholder.com/40" alt="Avatar" class="w-10 h-10 rounded-full">
            <div>
              <h4 class="font-medium">{{ user.name }}</h4>
              <p class="text-sm text-gray-600">{{ user.email }}</p>
              <p class="text-xs text-gray-500">Miembro desde: {{ user.joinedDate }}</p>
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <span class="px-2 py-1 text-xs rounded-full"
                  [ngClass]="{
                    'bg-red-100 text-red-800': user.role === 'Admin',
                    'bg-blue-100 text-blue-800': user.role === 'Member'
                  }">
              {{ user.role }}
            </span>
            <button (click)="removeUser(user.id)" class="px-3 py-1 bg-red-500 text-white text-sm rounded hover:bg-red-600">
              Eliminar
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="groupUsers.length === 0" class="text-center py-8 text-gray-500">
        <p>No hay usuarios en este grupo.</p>
      </div>
    </div>
  </div>
</div>
