<div class="min-h-screen bg-gray-50 p-6">
  <!-- Header -->
  <div class="mb-8">
    <div class="flex items-center justify-between">
      <button class="p-2 rounded-lg hover:bg-gray-200 transition" (click)="toggleSidebar()" title="Menú">
        <i class="pi pi-bars text-xl"></i>
      </button>
      <h1 class="text-3xl font-bold flex items-center gap-3">
        <i class="pi pi-home"></i>
        Panel de Control
      </h1>
      <div></div>
    </div>
    <p class="text-gray-600 mt-2">Bienvenido a tu panel principal</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Summary Card -->
    <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
      <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i class="pi pi-info-circle text-blue-600"></i>
        Resumen
      </h3>
      <p class="text-gray-600 mb-4">Esta es tu área de panel principal. Puedes agregar gráficos, estadísticas y otros componentes aquí.</p>
      <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition">
        <i class="pi pi-eye"></i>
        Ver Detalles
      </button>
    </div>

    <!-- Recent Activity Card -->
    <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
      <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i class="pi pi-history text-green-600"></i>
        Actividad Reciente
      </h3>
      <ul class="space-y-3">
        <li class="flex items-center gap-2 text-gray-700">
          <i class="pi pi-check-circle text-green-600"></i>
          Usuario inició sesión correctamente
        </li>
        <li class="flex items-center gap-2 text-gray-700">
          <i class="pi pi-user text-blue-600"></i>
          Perfil actualizado
        </li>
        <li class="flex items-center gap-2 text-gray-700">
          <i class="pi pi-bell text-yellow-600"></i>
          Nueva notificación recibida
        </li>
      </ul>
    </div>

    <!-- Quick Actions Card -->
    <div class="bg-white rounded-xl shadow p-6 hover:shadow-lg transition">
      <h3 class="text-lg font-bold mb-4 flex items-center gap-2">
        <i class="pi pi-lightning text-purple-600"></i>
        Acciones Rápidas
      </h3>
      <div class="flex flex-col gap-3">
        <button class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition justify-center">
          <i class="pi pi-plus"></i>
          Agregar Nuevo
        </button>
        <button class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition justify-center">
          <i class="pi pi-cog"></i>
          Configuración
        </button>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition justify-center">
          <i class="pi pi-chart-bar"></i>
          Reportes
        </button>
      </div>
    </div>
  </div>
</div>
