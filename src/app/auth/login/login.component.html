<p-toast></p-toast>

<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <input
          pInputText
          type="email"
          placeholder="Email"
          formControlName="email"
          class="w-full"
        />
      </div>

      <div class="field">
        <p-password
          formControlName="password"
          placeholder="Password"
          [feedback]="false"
          class="w-full"
        ></p-password>
      </div>

      <button
        pButton
        type="submit"
        label="Login"
        class="w-full mt-3"
      ></button>

    </form>

    <p class="mt-3">
      Don't have an account?
      <a routerLink="/auth/register">Register</a>
    </p>
  </div>
</div>
